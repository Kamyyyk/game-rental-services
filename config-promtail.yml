server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/api/prom/push

scrape_configs:
  - job_name: 'microservices'
    static_configs:
      - labels:
          job: 'infrastructure'
          container_name: 'configuration-server'
          __path__: /app/logs/config-server.log
      - labels:
          job: 'infrastructure'
          container_name: 'eureka-server'
          __path__: /app/logs/eureka-server.log
      - labels:
          job: 'infrastructure'
          container_name: 'api-gateway'
          __path__: /app/logs/api-gateway.log
      - labels:
          job: 'services'
          container_name: 'inventory-service'
          __path__: /app/logs/inventory-service.log
      - labels:
          job: 'services'
          container_name: 'game-service'
          __path__: /app/logs/game-service.log